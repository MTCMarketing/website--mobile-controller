<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Controller</title>
<meta name="theme-color" content="#1d4ed8">
<style>
  :root {
    color-scheme: light dark;
    --line: #e4e8ee;
    --muted: #586374;
    --bg: #f6f8fb;
    --card: #ffffff;
    --ink: #16202c;
    --accent: #1d4ed8;
    --verified: #1f8a5b;
    --warn: #b45309;
    --bad: #c0462f;
    --ok: #1f7a4f;
    --btn: #1d4ed8;
    --btn-bad: #c0462f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --line: #2a3542; --muted: #93a1b1; --bg: #0f151c; --card: #161e27; --ink: #e8eef5;
      --accent: #5b8def; --verified: #3fbf86; --warn: #f0a04b; --bad: #ef7a63; --ok: #4cc58a;
      --btn: #2955c9; --btn-bad: #b43f2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(100%, 760px); margin: 0 auto; }
  h1 { margin: 4px 0 2px; font-size: 20px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

  .card {
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .card h2 { margin: 0 0 8px; font-size: 15px; }

  label { display: block; margin-bottom: 9px; }
  label span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--card);
    color: inherit;
    font: inherit;
  }

  button {
    min-height: 44px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: var(--btn);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.flat { background: transparent; border-color: var(--line); color: inherit; }
  button.danger { background: var(--btn-bad); color: #fff; }
  button[disabled] { opacity: .55; cursor: default; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .gap { flex: 1; }

  .said { margin: 8px 0 0; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }

  /* ── the jobs ── */
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  li.job {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    border-radius: 0 10px 10px 0;
    background: var(--card);
  }
  li.job[data-state="open"] { border-left-color: var(--ok); }
  li.job[data-state="closed"] { border-left-color: var(--muted); }
  .job-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
  .job-top strong { font-size: 15px; }
  .job-top .made { margin-left: auto; color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
  }
  .pill[data-tone="running"] { color: var(--ok); border-color: var(--ok); }
  .pill[data-tone="blocked"] { color: var(--warn); border-color: var(--warn); }
  .pill[data-tone="stopped"] { color: var(--bad); border-color: var(--bad); }
  .pill[data-tone="complete"] { color: var(--accent); border-color: var(--accent); }
  .job-src { margin: 3px 0 6px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; }
  .job-line { margin: 2px 0; font-size: 12px; color: var(--muted); }
  .job-line.warn { color: var(--warn); }

  .meter { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; color: var(--muted); }
  .meter b { font-weight: 600; color: var(--ink); }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .meter[data-kind="verified"] .bar i { background: var(--verified); }
  .meter .figure { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .acts { margin-top: 10px; }
  .ask { margin-top: 10px; padding: 10px; border: 1px solid var(--warn); border-radius: 9px; }
  .ask p { margin: 0 0 8px; font-size: 13px; font-weight: 600; }

  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details[open] summary { margin-bottom: 10px; }

  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Mobile Controller</h1>
  <p class="sub">The scraper's jobs, and where each has got to.</p>

  <!-- ── signing in ─────────────────────────────────────────────────
       First, and on its own. This is a thing somebody opens on a phone
       to see whether the scraper is still going; the project it talks to
       is set once and then never thought about again. -->
  <section class="card" id="login">
    <h2>Sign in</h2>
    <label><span>Email</span><input id="email" type="email" autocomplete="username" inputmode="email"></label>
    <label><span>Password</span><input id="password" type="password" autocomplete="current-password"></label>
    <div class="row"><button id="go">Sign in</button></div>
    <p class="said" id="needs"></p>
    <p class="said" id="login-said"></p>
  </section>

  <!-- ── what it talks to ───────────────────────────────────────────
       Out of the way, because it is answered once. It opens itself when
       there is nothing there yet, since a sign-in with nowhere to sign
       in to would be a dead end with no explanation. -->
  <details class="card" id="setup-wrap">
    <summary>Connection</summary>
    <div id="setup">
      <label><span>Supabase URL</span>
        <input id="url" placeholder="https://yourproject.supabase.co" autocomplete="off" inputmode="url"></label>
      <label><span>Anon key</span>
        <input id="anon" placeholder="eyJ… or sb_publishable_…" autocomplete="off"></label>
      <p class="said" style="margin:6px 0 8px">Nothing else is needed to start and stop jobs: the alerts Worker's address and key are kept in the project, not in this page.</p>
      <div class="row"><button id="save-setup">Save</button></div>
      <p class="said" id="setup-said"></p>
    </div>
  </details>

  <!-- ── where to go, once signed in ───────────────────────────────── -->
  <section class="card hidden" id="menu">
    <h2>Signed in</h2>
    <p class="said" id="who-said"></p>
    <div class="row">
      <button id="open-jobs">Scraper jobs</button>
      <span class="gap"></span>
      <button class="flat" id="out">Sign out</button>
    </div>
  </section>

  <!-- ── the jobs ──────────────────────────────────────────────────── -->
  <section class="card hidden" id="jobs">
    <div class="row">
      <button class="flat" id="back" aria-label="Back">&larr;</button>
      <h2 style="margin:0">Jobs</h2>
      <span class="gap"></span>
      <button class="flat" id="refresh">Refresh</button>
    </div>
    <p class="said" id="jobs-said" role="status"></p>
    <p class="said" id="act-said" role="status"></p>
    <ul id="list" aria-label="Jobs"></ul>
  </section>
</main>

<script>
/* ============================================================
 *  Mobile Controller.
 *
 *  Sign in to the scraper's Supabase, then show its jobs the way the
 *  planner's Jobs screen does (machine, job, source, state, status, how
 *  far scraped and how far verified), and start, break and refresh them.
 *  Everything is the anon key plus a signed-in session, so what this can
 *  see is exactly what that account's row level security allows — this
 *  page grants nothing.
 * ============================================================ */

/*
 * Where the scraper keeps its work.
 *
 * Baked in, because this is opened on a phone to see whether the
 * scraper is still going — being asked for a project URL first is the
 * thing that makes somebody put the phone down.
 *
 * The publishable key is the public one by design: it is in every page
 * the planner itself serves, and what it can see is decided by row level
 * security plus whoever is signed in. It is not the secret key, and this
 * page refuses one.
 */
const SCRAPER = {
  url: "https://tqrowtgkszusuitjdbcw.supabase.co",
  anon: "sb_publishable_8rshOE9Zo_TnRtVoJzVJmg_jV_qfwMd",
};

/*
 * Where the PWA alerts keep their register of devices (which device is named
 * MM1, MM2): the Worker writes it into the entity tracker's project, not the
 * scraper's, and holds the devices of more than one Worker, so the Worker is
 * named too. The key is that project's publishable one, public by design.
 */
const REGISTER = {
  url: "https://wfifewzetvhefddplqsz.supabase.co",
  anon: "sb_publishable_cT1jH55AwYuSsYJkj0e6FA_bGffCddD",
  worker: "test-alerts",
};

const KEY = "mobile-controller:v1";
const EVERY_MS = 10000;
const $ = (id) => document.getElementById(id);

const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const write = (next) => { try { localStorage.setItem(KEY, JSON.stringify(next)); } catch {} };

let state = { ...SCRAPER, ...read() };
let where = "menu";
let jobs = [];
let busy = null;      // "machine|id" while a call is being sent
let breaking = null;  // "machine|id" while "stop it now?" is asked
let timer = 0;

function show() {
  const ready = state.url && state.anon;
  const inside = Boolean(state.token);

  /* Both are on screen from the start: hiding the sign-in until the
     connection was saved left a first visit looking like a form with
     nothing after it. It is shown and disabled, which says what comes
     next instead of leaving somebody to guess. */
  $("login").classList.toggle("hidden", inside);
  $("setup-wrap").classList.toggle("hidden", inside);
  // Open on a first visit, shut once it is answered.
  $("setup-wrap").open = !ready;

  for (const id of ["email", "password", "go"]) $(id).disabled = !ready;
  $("needs").textContent = ready ? "" : "No project connected yet — fill in Connection below.";
  $("menu").classList.toggle("hidden", !inside || where !== "menu");
  $("jobs").classList.toggle("hidden", !inside || where !== "jobs");

  if (ready) {
    $("url").value = state.url || "";
    $("anon").value = state.anon || "";
  }
  if (inside) $("who-said").textContent = "Signed in as " + (state.who || "") + ".";
  watch();
}

function say(where, text, tone) {
  const el = $(where);
  el.textContent = text;
  el.classList.toggle("bad", tone === "bad");
  el.classList.toggle("ok", tone === "ok");
}

/* ── connection ───────────────────────────────────────────────────── */

$("save-setup").addEventListener("click", () => {
  const url = $("url").value.trim().replace(/\/$/, "");
  const anon = $("anon").value.trim();

  if (!/^https:\/\/.+/.test(url)) return say("setup-said", "That is not an https address.", "bad");
  // Said plainly: a service key here would be readable by anybody who
  // opens this page, and it bypasses every policy in the database.
  if (/^sb_secret_|service_role/.test(anon)) {
    return say("setup-said", "That looks like a service key. Use the anon/publishable one — a service key in a page can be read by anybody.", "bad");
  }
  if (!anon) return say("setup-said", "The anon key is missing.", "bad");

  state = { ...state, url, anon };
  write(state);
  say("setup-said", "Saved. Sign in above.");
  show();
});

/* ── signing in ───────────────────────────────────────────────────── */

async function token(body, grant) {
  const response = await fetch(state.url + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { apikey: state.anon, "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const answer = await response.json().catch(() => ({}));
  return { ok: response.ok && typeof answer.access_token === "string", answer };
}

$("go").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return say("login-said", "Both are needed.", "bad");

  $("go").disabled = true;
  say("login-said", "Signing in…");
  try {
    const got = await token({ email, password }, "password");
    if (!got.ok) {
      // Never "no such user": whether an email exists is not this page's
      // to reveal.
      return say("login-said", "That email and password do not match.", "bad");
    }
    state = { ...state, token: got.answer.access_token, refresh: got.answer.refresh_token || "", who: email };
    write(state);
    say("login-said", "");
    show();
  } catch (error) {
    say("login-said", "Could not reach that project: " + error.message, "bad");
  } finally {
    $("go").disabled = false;
  }
});

function signOut(message) {
  state = { ...state, token: "", refresh: "", who: "" };
  write(state);
  jobs = [];
  $("list").replaceChildren();
  where = "menu";
  show();
  if (message) say("login-said", message, "bad");
}

$("out").addEventListener("click", () => signOut(""));

/* A session lasts about an hour; a phone left open should not need a
   password again for that, so the refresh token is used once first. */
async function renew() {
  if (!state.refresh) return false;
  try {
    const got = await token({ refresh_token: state.refresh }, "refresh_token");
    if (!got.ok) return false;
    state = { ...state, token: got.answer.access_token, refresh: got.answer.refresh_token || state.refresh };
    write(state);
    return true;
  } catch {
    return false;
  }
}

/** One call to the project as the signed-in account. A refused session is renewed once; if that fails the page signs out. */
async function api(path, init, again = true) {
  const response = await fetch(state.url + path, {
    ...init,
    headers: {
      apikey: state.anon,
      authorization: "Bearer " + state.token,
      ...((init && init.headers) || {}),
    },
  });
  if (response.status === 401 && again && (await renew())) return api(path, init, false);
  if (response.status === 401) {
    signOut("That session has expired. Sign in again.");
    throw new Error("The session has expired.");
  }
  return response;
}

/* ── the jobs ─────────────────────────────────────────────────────── */

const MACHINE = /^[A-Za-z][A-Za-z0-9_-]{0,19}$/;
const TITLE_SOURCE = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;
const keyOf = (job) => job.machine + "|" + job.id;
const titleOf = (job) => "job--" + job.id + "--" + job.source;

/** "7/35" -> { done, total, percent }, or null. */
function completion(value) {
  const m = typeof value === "string" ? /^(\d{1,6})\/(\d{1,6})$/.exec(value.trim()) : null;
  if (!m) return null;
  const done = Number(m[1]);
  const total = Number(m[2]);
  if (done > total) return null;
  return { done, total, percent: total === 0 ? 0 : Math.round((done / total) * 100) };
}

/** One entry of the list, checked; null when it is not a job. */
function clean(item) {
  if (!item || typeof item !== "object" || Array.isArray(item)) return null;
  const id = item.id;
  if (!MACHINE.test(String(item.machine)) || !Number.isSafeInteger(id) || id < 1) return null;
  const text = (v, max) => (typeof v === "string" ? v.slice(0, max) : "");
  return {
    machine: String(item.machine),
    id,
    source: text(item.source, 200),
    state: item.state === "open" ? "open" : "close",
    status: text(item.status, 30) || "new",
    scraped: completion(item.completion),
    verified: completion(item.verified),
    verifyStatus: text(item["verify-status"], 30),
    note: text(item.note, 500),
    made: text(item.datetime, 40),
  };
}

const WORDS = {
  new: ["New", "Made, not started yet."],
  running: ["Running", "The scraper is working on it."],
  paused: ["Paused", "Waiting to be started again."],
  stopped: ["Stopped", "Stopped; start it again to go on."],
  complete: ["Complete", "Every query is done."],
  incomplete: ["Incomplete", "It ended before every query was done."],
  break: ["Break", "It was asked to stop and the scraper has exited."],
  killed: ["Killed", "The scraper's process ended before the job was done. Start it again to go on."],
  blocked: ["Blocked (captcha)", "Google asked for a captcha. Solve it on the machine."],
  capcha: ["Blocked (captcha)", "Google asked for a captcha. Solve it on the machine."],
};
const wordsOf = (status) => WORDS[status] || [status.charAt(0).toUpperCase() + status.slice(1), ""];
const isBlocked = (status) => status === "blocked" || status === "capcha";
const toneOf = (status) =>
  status === "running" ? "running" :
  isBlocked(status) ? "blocked" :
  status === "break" || status === "killed" ? "stopped" :
  status === "complete" ? "complete" : "";

async function load() {
  if (!state.token || where !== "jobs") return;
  try {
    const response = await api("/rest/v1/rpc/job_list", { method: "GET" });
    if (response.status === 404) {
      return say("jobs-said", "The project has no list of jobs yet: run supabase/migrations/20261030150000_job_endpoints.sql in its SQL editor.", "bad");
    }
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      return say("jobs-said", (body && body.message) || ("The project answered " + response.status + "."), "bad");
    }
    const body = await response.json();
    jobs = Array.isArray(body) ? body.slice(0, 5000).flatMap((item) => clean(item) || []) : [];
    draw();
    const running = jobs.filter((job) => job.status === "running").length;
    const machines = new Set(jobs.map((job) => job.machine)).size;
    say("jobs-said", jobs.length + (jobs.length === 1 ? " job" : " jobs") + " on " + machines +
      (machines === 1 ? " machine" : " machines") + " · " + running + " running · read " +
      new Date().toLocaleTimeString());
  } catch (error) {
    if (state.token) say("jobs-said", "Could not read it: " + error.message, "bad");
  }
}

function element(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function meter(kind, label, value, subject) {
  const row = element("div", "meter");
  row.dataset.kind = kind;
  row.append(element("b", "", label));
  const bar = element("div", "bar");
  bar.setAttribute("role", "img");
  bar.setAttribute("aria-label", label + " " + (value ? value.done + " of " + value.total + " queries" : "not known") + " for " + subject);
  const fill = element("i");
  fill.style.width = (value ? value.percent : 0) + "%";
  bar.append(fill);
  row.append(bar, element("span", "figure", value ? value.done + "/" + value.total + " · " + value.percent + "%" : "—"));
  return row;
}

function button(label, className, onClick, aria) {
  const b = element("button", className, label);
  b.type = "button";
  b.setAttribute("aria-label", aria || label);
  b.disabled = busy !== null;
  b.addEventListener("click", onClick);
  return b;
}

function draw() {
  const list = $("list");
  list.replaceChildren();

  if (jobs.length === 0) {
    list.append(element("li", "job", "No job is in the project yet."));
    return;
  }

  for (const job of jobs) {
    const subject = "job " + job.id + " on " + job.machine;
    const [label, meaning] = wordsOf(job.status);
    const li = element("li", "job");
    li.dataset.state = job.state === "open" ? "open" : "closed";
    li.dataset.machine = job.machine;
    li.dataset.jobId = String(job.id);
    li.dataset.status = job.status;

    const top = element("div", "job-top");
    top.append(element("strong", "", job.machine + " · job " + job.id));
    const pill = element("span", "pill", label);
    pill.dataset.tone = toneOf(job.status);
    pill.title = meaning;
    top.append(pill);
    if (job.made) {
      const when = new Date(job.made);
      if (!Number.isNaN(when.getTime())) {
        top.append(element("span", "made", when.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })));
      }
    }
    li.append(top, element("p", "job-src", job.source));

    const running = job.status === "running";
    // (a job whose verify pass is going is open on purpose)
    const verifying = job.verifyStatus === "running" || job.verifyStatus === "blocked";
    const closedByError = job.state === "open" && !running && !isBlocked(job.status) && !verifying;
    li.append(element("p", "job-line", "State: " + (job.state === "open" ? "open" : "closed")));
    if (closedByError) li.append(element("p", "job-line warn", "Left open: closed by error?"));
    if (job.note) li.append(element("p", "job-line warn", job.note));
    if (job.verifyStatus) li.append(element("p", "job-line", "Verify: " + job.verifyStatus));

    li.append(meter("scraped", "Scraped", job.scraped, subject), meter("verified", "Verified", job.verified, subject));

    // What can be done, as the planner's Jobs screen has it.
    const canTitle = TITLE_SOURCE.test(job.source);
    const acts = element("div", "row acts");
    if (!canTitle) {
      li.append(element("p", "job-line warn", "This job's source has a form the buttons cannot name."));
    } else if (breaking === keyOf(job)) {
      const ask = element("div", "ask");
      ask.setAttribute("role", "alertdialog");
      ask.setAttribute("aria-label", "Stop " + subject);
      ask.append(element("p", "", "Stop it now?"));
      const choices = element("div", "row");
      choices.append(
        button("Yes, break it", "danger", () => { breaking = null; void send(job, "break-job"); }, "Yes, break " + subject),
        button("Keep it running", "flat", () => { breaking = null; draw(); }),
      );
      ask.append(choices);
      li.append(ask);
    } else {
      if (!running && !isBlocked(job.status) && job.status !== "complete") {
        acts.append(button("Start", "", () => void send(job, "start-job"), "Start " + subject));
      }
      if (running) {
        acts.append(button("Break", "danger", () => { breaking = keyOf(job); draw(); }, "Break " + subject));
      }
      if (job.state === "open" || running) {
        acts.append(button("Refresh status", "flat", () => void send(job, "refresh-job"), "Refresh status of " + subject));
      }
      if (job.verifyStatus === "running" || job.verifyStatus === "blocked") {
        acts.append(
          button("Break verify", "flat", () => void send(job, "break-verify"), "Break verify of " + subject),
          button("Refresh verify", "flat", () => void send(job, "refresh-verify"), "Refresh verify of " + subject),
        );
      } else if (job.status === "complete" && (!job.verified || job.verified.done !== job.verified.total)) {
        acts.append(button("Verify", "flat", () => void send(job, "start-verify"), "Verify " + subject));
      }
      if (isBlocked(job.status)) {
        li.append(element("p", "job-line warn", "Waiting for a captcha: solve it on the machine."));
      }
      if (acts.childNodes.length > 0) li.append(acts);
    }
    list.append(li);
  }
}

$("refresh").addEventListener("click", () => void load());
$("open-jobs").addEventListener("click", () => { where = "jobs"; show(); void load(); });
$("back").addEventListener("click", () => { where = "menu"; show(); });

/* The list is read again every ten seconds while it is on screen. */
function watch() {
  window.clearInterval(timer);
  if (state.token && where === "jobs") {
    timer = window.setInterval(() => { if (document.visibilityState === "visible" && busy === null) void load(); }, EVERY_MS);
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && where === "jobs") void load();
});

/* ── making something happen on a machine somewhere else ──────────────
 *
 * The button does not reach the scraper. It asks the project's "push"
 * function (which holds the alerts Worker's address and send key as its
 * secrets, so neither is in this page or on this phone), and the Worker
 * pushes the call to the device named for that machine. That machine's
 * service worker POSTs it to the listener running there. The phone is not
 * on that network; the machine is.
 *
 * The device is found the way the planner finds it: the PWA's register,
 * the device whose name is the machine's ("MM1").
 */
const ACTION_WORDS = {
  "start-job": ["start", "The start"],
  "break-job": ["break", "The break"],
  "refresh-job": ["refresh", "The refresh"],
  "start-verify": ["start of the verify", "The start of the verify"],
  "break-verify": ["break of the verify", "The break of the verify"],
  "refresh-verify": ["refresh of the verify", "The refresh of the verify"],
};

async function deviceOf(machine) {
  const response = await fetch(
    REGISTER.url + "/rest/v1/pwa_subscribers?worker=eq." + encodeURIComponent(REGISTER.worker) +
      "&gone_at=is.null&select=sub_id,label&order=at.desc&limit=500",
    { headers: { apikey: REGISTER.anon } },
  );
  if (!response.ok) {
    throw new Error(response.status === 404
      ? "The PWA's list of devices (pwa_subscribers) is not in the entity tracker's project yet."
      : "The list of devices could not be read (" + response.status + ").");
  }
  const rows = await response.json();
  const wanted = machine.toLowerCase();
  const found = (Array.isArray(rows) ? rows : []).find((row) =>
    row && typeof row.sub_id === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(row.sub_id) &&
    typeof row.label === "string" && row.label.trim().toLowerCase() === wanted);
  if (!found) {
    throw new Error("No device is named " + machine.toUpperCase() + " in the PWA (open its Users list, choose the machine's device and press \"Name it\").");
  }
  return found.sub_id;
}

async function send(job, action) {
  if (busy !== null) return;
  const [what, said] = ACTION_WORDS[action];
  busy = keyOf(job);
  draw();
  say("act-said", said + " is being sent to " + job.machine + "…");
  try {
    const device = await deviceOf(job.machine);
    const response = await api("/functions/v1/push", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ machine: job.machine, job: titleOf(job), only: [device], action }),
    });
    const body = await response.json().catch(() => ({}));
    if (response.status === 404 && (body.code === "NOT_FOUND" || !body.error)) {
      throw new Error('The "push" function is not deployed in the project yet.');
    }
    if (response.status === 403) {
      throw new Error("This account may not send pushes: sign in as the scraper account.");
    }
    if (!response.ok) throw new Error(typeof body.error === "string" ? body.error : "The project answered " + response.status + ".");
    const sent = Number(body.sent) || 0;
    const failed = Number(body.failed) || 0;
    if (sent < 1 || failed > 0) {
      throw new Error("The " + what + " did not reach " + job.machine + "'s device: sent " + sent + ", failed " + failed + ". It was not sent another way.");
    }
    say("act-said", said + " was sent to " + job.machine + "'s device by push; the job's status follows below.", "ok");
    window.setTimeout(() => void load(), 4000);
  } catch (error) {
    say("act-said", "The " + what + " could not be sent: " + error.message, "bad");
  } finally {
    busy = null;
    draw();
  }
}

/* ── start ────────────────────────────────────────────────────────── */

show();
</script>
