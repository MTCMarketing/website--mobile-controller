<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Controller</title>
<meta name="theme-color" content="#1d4ed8">
<style>
  :root {
    color-scheme: light dark;
    --line: #e4e8ee;
    --muted: #6b7684;
    --bg: #f6f8fb;
    --card: #ffffff;
    --ink: #16202c;
    --accent: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --line: #2a3542; --muted: #93a1b1; --bg: #0f151c; --card: #161e27; --ink: #e8eef5; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(100%, 760px); margin: 0 auto; }
  h1 { margin: 4px 0 2px; font-size: 20px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

  .card {
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .card h2 { margin: 0 0 8px; font-size: 15px; }

  label { display: block; margin-bottom: 9px; }
  label span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--card);
    color: inherit;
    font: inherit;
  }

  button {
    padding: 10px 16px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.flat { background: transparent; border: 1px solid var(--line); color: inherit; }
  button[disabled] { opacity: .55; cursor: default; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .gap { flex: 1; }

  .said { margin: 8px 0 0; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  .bad { color: #c0462f; }

  /* ── the jobs ── */
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  li.job {
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 0 10px 10px 0;
    background: var(--card);
  }
  li.job[data-state="open"] { border-left-color: #2f9e6b; }
  li.job[data-state="closed"] { border-left-color: var(--muted); }
  .job-top { display: flex; align-items: baseline; gap: 8px; }
  .job-top strong { font-size: 14px; }
  .job-top em { color: var(--muted); font-size: 12px; font-style: normal; }
  .job-src { margin: 2px 0 7px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, monospace; }
  .bar { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .job-foot { display: flex; gap: 8px; margin-top: 5px; color: var(--muted); font-size: 12px; }

  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details[open] summary { margin-bottom: 10px; }

  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Mobile Controller</h1>
  <p class="sub">The scraper's jobs, and where each has got to.</p>

  <!-- ── signing in ─────────────────────────────────────────────────
       First, and on its own. This is a thing somebody opens on a phone
       to see whether the scraper is still going; the project it talks to
       is set once and then never thought about again. -->
  <section class="card" id="login">
    <h2>Sign in</h2>
    <label><span>Email</span><input id="email" type="email" autocomplete="username" inputmode="email"></label>
    <label><span>Password</span><input id="password" type="password" autocomplete="current-password"></label>
    <div class="row"><button id="go">Sign in</button></div>
    <p class="said" id="needs"></p>
    <p class="said" id="login-said"></p>
  </section>

  <!-- ── what it talks to ───────────────────────────────────────────
       Out of the way, because it is answered once. It opens itself when
       there is nothing there yet, since a sign-in with nowhere to sign
       in to would be a dead end with no explanation. -->
  <details class="card" id="setup-wrap">
    <summary>Connection</summary>
    <div id="setup">
      <label><span>Supabase URL</span>
        <input id="url" placeholder="https://yourproject.supabase.co" autocomplete="off" inputmode="url"></label>
      <label><span>Anon key</span>
        <input id="anon" placeholder="eyJ… or sb_publishable_…" autocomplete="off"></label>
      <label><span>Jobs table</span>
        <input id="table" value="scrape_jobs" autocomplete="off"></label>

      <p class="said" style="margin:14px 0 8px">The rest is for triggering the scraper from a push, which comes later. Leave it empty to just watch the jobs.</p>

      <label><span>Alerts Worker URL</span>
        <input id="worker" placeholder="https://test-alerts.makethemcall.workers.dev" autocomplete="off" inputmode="url"></label>
      <label><span>Send key</span>
        <input id="sendkey" type="password" placeholder="kept in this browser only" autocomplete="off"></label>
      <div class="row" style="gap:12px">
        <label style="flex:1"><span>Listener port</span><input id="port" value="8765" autocomplete="off" inputmode="numeric"></label>
        <label style="flex:1"><span>Listener path</span><input id="path" value="/trigger" autocomplete="off"></label>
      </div>
      <div class="row"><button id="save-setup">Save</button></div>
      <p class="said" id="setup-said"></p>
    </div>
  </details>

  <!-- ── where to go, once signed in ───────────────────────────────── -->
  <section class="card hidden" id="menu">
    <h2>Signed in</h2>
    <p class="said" id="who-said"></p>
    <div class="row">
      <button id="open-jobs">Scraper jobs</button>
      <span class="gap"></span>
      <button class="flat" id="out">Sign out</button>
    </div>
  </section>

  <!-- ── the jobs ──────────────────────────────────────────────────── -->
  <section class="card hidden" id="jobs">
    <div class="row">
      <button class="flat" id="back">&larr;</button>
      <h2 style="margin:0">Jobs</h2>
      <span class="gap"></span>
      <button class="flat" id="refresh">Refresh</button>
    </div>
    <p class="said" id="jobs-said"></p>

    <h3 style="margin:14px 0 6px;font-size:13px">On the machines</h3>
    <ul id="live"></ul>

    <h3 style="margin:18px 0 6px;font-size:13px">In the pool</h3>
    <ul id="list"></ul>
  </section>
</main>

<script>
/* ============================================================
 *  Mobile Controller — a prototype.
 *
 *  Sign in to the scraper's Supabase, then read the jobs table.
 *  Everything is the anon key plus a signed-in session, so what
 *  this can see is exactly what that account's row level
 *  security allows — this page grants nothing.
 * ============================================================ */

/*
 * Where the scraper keeps its work.
 *
 * Baked in, because this is opened on a phone to see whether the
 * scraper is still going — being asked for a project URL first is the
 * thing that makes somebody put the phone down.
 *
 * The publishable key is the public one by design: it is in every page
 * the planner itself serves, and what it can see is decided by row level
 * security plus whoever is signed in. It is not the secret key, and this
 * page refuses one.
 */
const SCRAPER = {
  url: "https://tqrowtgkszusuitjdbcw.supabase.co",
  anon: "sb_publishable_8rshOE9Zo_TnRtVoJzVJmg_jV_qfwMd",
  table: "scrape_jobs",
};

const KEY = "mobile-controller:v1";
const $ = (id) => document.getElementById(id);

const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const write = (next) => { try { localStorage.setItem(KEY, JSON.stringify(next)); } catch {} };

let state = { ...SCRAPER, ...read() };

let where = "menu";

function show() {
  const ready = state.url && state.anon;
  const inside = Boolean(state.token);

  /* Both are on screen from the start: hiding the sign-in until the
     connection was saved left a first visit looking like a form with
     nothing after it. It is shown and disabled, which says what comes
     next instead of leaving somebody to guess. */
  $("login").classList.toggle("hidden", inside);
  $("setup-wrap").classList.toggle("hidden", inside);
  // Open on a first visit, shut once it is answered.
  $("setup-wrap").open = !ready;

  for (const id of ["email", "password", "go"]) $(id).disabled = !ready;
  $("needs").textContent = ready ? "" : "No project connected yet — fill in Connection below.";
  $("menu").classList.toggle("hidden", !inside || where !== "menu");
  $("jobs").classList.toggle("hidden", !inside || where !== "jobs");

  if (ready) {
    $("url").value = state.url || "";
    $("anon").value = state.anon || "";
    $("table").value = state.table || "scrape_jobs";
    $("worker").value = state.worker || "";
    $("sendkey").value = state.sendKey || "";
    $("port").value = state.port || "8765";
    $("path").value = state.path || "/trigger";
  }
  if (inside) $("who-said").textContent = "Signed in as " + (state.who || "") + ".";
}

function say(where, text, bad) {
  const el = $(where);
  el.textContent = text;
  el.classList.toggle("bad", Boolean(bad));
}

/* ── connection ───────────────────────────────────────────────────── */

$("save-setup").addEventListener("click", () => {
  const url = $("url").value.trim().replace(/\/$/, "");
  const anon = $("anon").value.trim();
  const table = $("table").value.trim() || "scrape_jobs";

  if (!/^https:\/\/.+/.test(url)) return say("setup-said", "That is not an https address.", true);
  // Said plainly: a service key here would be readable by anybody who
  // opens this page, and it bypasses every policy in the database.
  if (/^sb_secret_|service_role/.test(anon)) {
    return say("setup-said", "That looks like a service key. Use the anon/publishable one — a service key in a page can be read by anybody.", true);
  }
  if (!anon) return say("setup-said", "The anon key is missing.", true);

  state = {
    ...state,
    url,
    anon,
    table,
    worker: $("worker").value.trim().replace(/\/$/, ""),
    sendKey: $("sendkey").value.trim(),
    port: $("port").value.trim() || "8765",
    path: ($("path").value.trim() || "/trigger").replace(/^\/?/, "/"),
  };
  write(state);
  say("setup-said", "Saved. Sign in above.");
  show();
});

/* ── signing in ───────────────────────────────────────────────────── */

$("go").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return say("login-said", "Both are needed.", true);

  $("go").disabled = true;
  say("login-said", "Signing in…");
  try {
    const response = await fetch(state.url + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: state.anon, "content-type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const body = await response.json();
    if (!response.ok) {
      // Never "no such user": whether an email exists is not this page's
      // to reveal.
      return say("login-said", "That email and password do not match.", true);
    }
    state = { ...state, token: body.access_token, who: email };
    write(state);
    say("login-said", "");
    show();
    await load();
  } catch (error) {
    say("login-said", "Could not reach that project: " + error.message, true);
  } finally {
    $("go").disabled = false;
  }
});

$("out").addEventListener("click", () => {
  state = { ...state, token: "", who: "" };
  write(state);
  $("list").innerHTML = "";
  show();
});

/* ── the jobs ─────────────────────────────────────────────────────── */

const pct = (done, of) => (of > 0 ? Math.round((done / of) * 100) : 0);

/* The column names are guessed from what the dashboard shows, and each
   falls back rather than printing "undefined" at somebody. */
const pick = (row, ...names) => {
  for (const name of names) {
    if (row[name] !== undefined && row[name] !== null && row[name] !== "") return row[name];
  }
  return "";
};

async function load() {
  if (!state.token) return;
  say("jobs-said", "Reading\u2026");
  try {
    const head = { apikey: state.anon, authorization: "Bearer " + state.token };

    /* Both, because neither answers the question alone: a job says what
       it is doing, and a batch says how much of it there is. */
    /* Two different things, and both are real.
     *
     * machine_jobs is what each machine says it is doing — the jobs the
     * planner finds by SSH, reported outwards so something that is not
     * on that network can see them. scrape_jobs is the pool machines
     * pull from. A phone wants the first and is told about the second.
     */
    const [liveAt, seenAt, jobsAt, batchesAt] = await Promise.all([
      fetch(state.url + "/rest/v1/machine_jobs?select=*&order=updated_at.desc&limit=200", { headers: head }),
      fetch(state.url + "/rest/v1/machine_status?select=*&order=last_seen.desc&limit=50", { headers: head }),
      fetch(state.url + "/rest/v1/" + (state.table || "scrape_jobs") +
        "?select=id,batch_id,block,status,machine,count,claimed_at,finished_at,error&order=id.desc&limit=500", { headers: head }),
      fetch(state.url + "/rest/v1/scrape_batches?select=id,label,phase,status,created_at&order=id.desc&limit=50", { headers: head }),
    ]);

    if (jobsAt.status === 401 || jobsAt.status === 403) {
      state = { ...state, token: "" };
      write(state);
      show();
      return say("login-said", "That session has expired. Sign in again.", true);
    }
    if (!jobsAt.ok) {
      const body = await jobsAt.json().catch(() => ({}));
      return say("jobs-said", (body && body.message) || ("The database answered " + jobsAt.status), true);
    }

    const jobs = await jobsAt.json();
    const batches = batchesAt.ok ? await batchesAt.json() : [];
    // 404 means the table is not there yet, which is a thing to say once
    // rather than an error to show every time.
    const live = liveAt.ok ? await liveAt.json() : [];
    const seen = seenAt.ok ? await seenAt.json() : [];

    drawLive(Array.isArray(live) ? live : [], Array.isArray(seen) ? seen : [], liveAt.status);
    draw(Array.isArray(jobs) ? jobs : [], Array.isArray(batches) ? batches : []);

    const running = (Array.isArray(live) ? live : []).filter((job) => job.status === "running").length;
    say("jobs-said", running + " running on the machines \u00b7 " + jobs.length +
      " in the pool \u00b7 read " + new Date().toLocaleTimeString());
  } catch (error) {
    say("jobs-said", "Could not read it: " + error.message, true);
  }
}

/**
 * What the machines say they are doing.
 *
 * Reported by each machine rather than found by looking, so a machine
 * that has stopped saying anything is its own kind of answer and is
 * shown as one — "nothing running" and "nobody has heard from mm2 since
 * Tuesday" are not the same news.
 */
function drawLive(jobs, machines, status) {
  const list = $("live");
  list.innerHTML = "";

  if (status === 404) {
    const none = document.createElement("li");
    none.className = "job";
    none.textContent = "The machines are not reporting yet — machine_jobs does not exist on this project.";
    list.append(none);
    return;
  }

  const old = Date.now() - 10 * 60 * 1000;
  for (const machine of machines) {
    const quiet = new Date(machine.last_seen).getTime() < old;
    const li = document.createElement("li");
    li.className = "job";
    li.dataset.state = quiet ? "closed" : "open";

    const top = document.createElement("div");
    top.className = "job-top";
    const name = document.createElement("strong");
    name.textContent = machine.machine;
    const when = document.createElement("em");
    when.textContent = quiet
      ? "last heard " + new Date(machine.last_seen).toLocaleString()
      : machine.jobs + (machine.jobs === 1 ? " job" : " jobs");
    top.append(name, when);
    li.append(top);

    if (machine.note) {
      const note = document.createElement("p");
      note.className = "job-src";
      note.textContent = machine.note;
      li.append(note);
    }

    for (const job of jobs.filter((one) => one.machine === machine.machine)) {
      const line = document.createElement("div");
      line.style.marginTop = "8px";

      const head = document.createElement("div");
      head.className = "job-top";
      const id = document.createElement("strong");
      id.textContent = job.job;
      const how = document.createElement("em");
      how.textContent = job.status + (job.note ? " \u00b7 " + job.note : "");
      head.append(id, how);

      const src = document.createElement("p");
      src.className = "job-src";
      src.textContent = job.source || "";

      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("i");
      fill.style.width = (job.total ? Math.round((job.done / job.total) * 100) : 0) + "%";
      bar.append(fill);

      const foot = document.createElement("div");
      foot.className = "job-foot";
      const count = document.createElement("span");
      count.textContent = job.done + "/" + job.total +
        (job.total ? " \u00b7 " + Math.round((job.done / job.total) * 100) + "%" : "");
      foot.append(count);

      line.append(head, src, bar, foot);
      li.append(line);
    }

    list.append(li);
  }

  if (machines.length === 0 && jobs.length === 0 && status !== 404) {
    const none = document.createElement("li");
    none.className = "job";
    none.textContent = "No machine has reported in yet.";
    list.append(none);
  }
}

function draw(jobs, batches) {
  const list = $("list");
  list.innerHTML = "";

  if (jobs.length === 0) {
    const empty = document.createElement("li");
    empty.className = "job";
    empty.textContent = "No jobs in the pool right now.";
    list.append(empty);
    return;
  }

  /* A batch is the unit somebody thinks in — "the Washington run" — and
     a job is one block of it. So the batch is the row, with how far
     through it is, and the jobs actually moving are named underneath. */
  const named = new Map(batches.map((batch) => [batch.id, batch]));
  const byBatch = new Map();
  for (const job of jobs) {
    const bucket = byBatch.get(job.batch_id) || [];
    bucket.push(job);
    byBatch.set(job.batch_id, bucket);
  }

  for (const [id, mine] of byBatch) {
    const batch = named.get(id) || {};
    const done = mine.filter((job) => job.status === "done").length;
    const running = mine.filter((job) => job.status === "running");
    const failed = mine.filter((job) => job.status === "failed").length;

    const li = document.createElement("li");
    li.className = "job";
    li.dataset.state = batch.status === "cancelled" ? "closed" : running.length ? "open" : "closed";

    const top = document.createElement("div");
    top.className = "job-top";
    const name = document.createElement("strong");
    name.textContent = batch.label || ("Batch " + id);
    const phase = document.createElement("em");
    phase.textContent = (batch.phase || "") + (batch.status === "cancelled" ? " \u00b7 cancelled" : "");
    top.append(name, phase);

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = (mine.length ? Math.round((done / mine.length) * 100) : 0) + "%";
    bar.append(fill);

    const foot = document.createElement("div");
    foot.className = "job-foot";
    const where = document.createElement("span");
    where.textContent = done + "/" + mine.length + " done";
    const how = document.createElement("span");
    how.textContent = running.length + " running" + (failed ? " \u00b7 " + failed + " failed" : "");
    foot.append(where, how);

    li.append(top, bar, foot);

    // The ones actually moving, with the machine doing them.
    for (const job of running.slice(0, 8)) {
      const line = document.createElement("p");
      line.className = "job-src";
      line.textContent = (job.machine || "unclaimed") + " \u00b7 " + (job.block || job.id) +
        (job.count ? " \u00b7 " + job.count + " rows" : "");
      li.append(line);
    }

    /* Test buttons: these send a push, so the machine beside the scraper
       does the work. Wired to the batch, which is what somebody actually
       wants to stop. */
    const acts = document.createElement("div");
    acts.className = "row";
    acts.style.marginTop = "8px";
    for (const verb of ["resume", "pause"]) {
      const button = document.createElement("button");
      button.className = verb === "resume" ? "" : "flat";
      button.textContent = verb === "resume" ? "Start" : "Break";
      button.addEventListener("click", () => void trigger(verb, String(id)));
      acts.append(button);
    }
    li.append(acts);

    list.append(li);
  }
}

$("refresh").addEventListener("click", () => void load());
$("open-jobs").addEventListener("click", () => { where = "jobs"; show(); void load(); });
$("back").addEventListener("click", () => { where = "menu"; show(); });

/* ── making something happen on a machine somewhere else ──────────────
 *
 * The button does not reach the scraper. It sends a push, and the
 * service worker on whichever machine receives it POSTs to the listener
 * running there — which is the whole point: the phone is not on that
 * network, and the machine is.
 *
 * So what travels is a notification carrying the instruction, and the
 * device nearest the scraper carries it out.
 */
async function trigger(verb, job) {
  if (!state.worker || !state.sendKey) {
    return say("jobs-said", "No alerts Worker is set, so there is nothing to send through. Change connection.", true);
  }
  say("jobs-said", verb + " " + job + "…");
  try {
    const response = await fetch(state.worker + "/send", {
      method: "POST",
      headers: { authorization: "Bearer " + state.sendKey, "content-type": "application/json" },
      body: JSON.stringify({
        title: verb + " job " + job,
        body: "Sent from the mobile controller.",
        url: "/",
        post: {
          port: state.port || "8765",
          path: state.path || "/trigger",
          // The shape asked for: a list of actions, each naming its job.
          // A list rather than one, because stopping three jobs is one
          // message rather than three.
          body: [{ action: verb, id: String(job) }],
        },
      }),
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      return say("jobs-said", response.status === 401
        ? "The Worker refused that send key."
        : (body.error || ("The Worker answered " + response.status)), true);
    }
    say("jobs-said", "Sent to " + (body.sent ?? 0) + (body.sent === 1 ? " device" : " devices") +
      ". The one running the listener will act on it.");
  } catch (error) {
    say("jobs-said", "Could not reach the Worker: " + error.message, true);
  }
}

/* ── start ────────────────────────────────────────────────────────── */

show();
if (state.token) void load();
</script>
</body>
</html>
